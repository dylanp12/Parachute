# HARDENED CONFIGURATION
# Use with: docker compose -f docker-compose.yml -f agents/<runtime>/compose.yaml -f docker-compose.hardened.yml up -d
#
# This profile adds additional security measures beyond network isolation:
# - Non-root execution
# - Dropped capabilities
# - Read-only filesystems
# - Resource limits
# - No privilege escalation
#
# For full egress control on the host, see docs/iptables-hardening.md
#
# Note: For agent-specific hardening, add security_opt/cap_drop/resource limits
# in the agent's compose.yaml (see agents/nemoclaw/ for an example).

services:
  parachute:
    # Run as non-root user (UID 1000)
    user: "1000:1000"
    # Security hardening options
    security_opt:
      - no-new-privileges:true
    # Drop ALL capabilities, only add what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Allow binding to ports < 1024 if needed
    # Read-only root filesystem prevents tampering
    read_only: true
    tmpfs:
      - /tmp:size=10M,mode=1777
    # Resource limits prevent DoS
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    # Prevent privilege escalation
    privileged: false
