# Credential Broker Demo
# Demonstrates credentialless agent access to GitHub APIs
#
# Start: docker compose -f docker-compose.broker-demo.yml up --build
# Dashboard: http://localhost:8080/dashboard/

services:
  parachute:
    build: .
    container_name: parachute-broker-demo
    ports:
      - "8080:8080"
      - "8888:8888"
      - "8081:8081"
    volumes:
      - ./demo/parachute.broker-demo.yaml:/etc/parachute/config.yaml:ro
    command: ["/app/parachute", "--config", "/etc/parachute/config.yaml"]
    environment:
      - PARACHUTE_PASSWORD=demo
      - GITHUB_TOKEN=demo-token-for-mock
    networks:
      - public
      - agent
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mock-github:
    build: ./demo/mock-github
    container_name: demo-mock-github
    networks:
      - public

  broker-simulator:
    build: ./demo/broker-simulator
    container_name: demo-broker-simulator
    environment:
      - BROKER_URL=http://parachute:8081
      - PROXY_URL=http://parachute:8888
    networks:
      - agent
    depends_on:
      parachute:
        condition: service_healthy

networks:
  public:
    driver: bridge
  agent:
    driver: bridge
    internal: true
