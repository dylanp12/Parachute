#     method: "POST"

# License key for Parachute Pro features (cloud relay, fleet dashboard, etc.)
# license:
#   key_env: "PARACHUTE_LICENSE_KEY"     # Read from environment variable

# Storage configuration
storage:
  type: "memory"  # Options: "memory" (volatile) or "sqlite" (persistent)
  path: "/var/lib/parachute/parachute.db"  # Required if type is "sqlite"

# Server configuration
upstream: "http://openclaw:3000"    # Agent container address (used for all reverse proxy forwarding)
listen: ":8080"                     # Main API/Dashboard port
proxy_listen: ":8888"               # Forward proxy port for agent egress
