# Parachute configuration example
# Copy this to parachute.yaml and customize
#
# For detailed documentation, see:
# - docs/openclaw-integration.md - OpenClaw gateway setup
# - docs/pii-detection.md - PII scanning limitations and recommendations

# DEPRECATED: Reverse proxy tool interception
# The reverse proxy still forwards HTTP traffic but no longer intercepts tool calls by default.
# Use the MCP gateway (mcp.enabled=true) for tool-call policy enforcement.
# reverse_proxy:
#   tool_interception:
#     enabled: false  # default; set true only for legacy compatibility

auth:
  username: "admin"
  password_env: "PARACHUTE_PASSWORD"  # Read password from this env var
  # token: "your-secret-token"        # Alternative: Bearer token
  allowed_ips: []                      # Empty = allow all authenticated users
  # allow_insecure: false             # Set to true to allow running without auth (DANGEROUS)

risk_policy:
  # Commands that are ALWAYS blocked (regex patterns)
  block_commands:
    - "rm -rf /"
    - "rm -rf ~"
    - ":(){ :|:& };:"                  # Fork bomb
    - "mkfs\\."                        # Filesystem formatting
    - "dd if=/dev/(zero|random) of=/dev/[sh]d"  # Disk overwrite

  # Commands that require manual approval (regex patterns)
  require_approval:
    - "\\brm\\b"                       # Any rm command
    - "\\bssh\\b"                      # SSH connections
    - "\\bcurl\\b.*(-X|--request).*POST"  # curl POST requests
    - "\\bwget\\b"                     # wget downloads
    - "\\bsudo\\b"                     # Privileged commands
    - "\\bgit\\b.*(push|force)"        # Git push/force operations

egress:
  mode: "enforce"  # "enforce" (default) or "record" (log only, don't block)
  # Structured rules (preferred)
  rules:
    - domains:
        - "api.anthropic.com"
        - "*.anthropic.com"
        - "api.openai.com"
      label: "llm-providers"
      action: "allow"
    - domains:
        - "github.com"
        - "*.githubusercontent.com"
      label: "code-hosting"
      action: "allow"
    - domains:
        - "pypi.org"
        - "npmjs.com"
        - "registry.npmjs.org"
      label: "package-registries"
      action: "allow"

  # Legacy flat list (auto-converted to rule with label "legacy")
  # allow_domains:
  #   - "api.anthropic.com"

  # PII patterns to detect and block
  pii_patterns:
    - "\\b4[0-9]{12}(?:[0-9]{3})?\\b"   # Visa card numbers
    - "\\b5[1-5][0-9]{14}\\b"           # Mastercard numbers
    - "-----BEGIN (?:RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----"  # Private keys
    - "AKIA[0-9A-Z]{16}"                # AWS Access Key ID
    - "gh[pous]_[a-zA-Z0-9]{36}"        # GitHub tokens

# Telemetry: SDR event recording and upload to Parachute Pro
telemetry:
  enabled: false
  agent_id: ""       # Auto-generated UUID if empty
  tenant_id: ""      # Your organization ID from Parachute Pro
  chain_state_path: "/var/lib/parachute/chain_state.json"
  # Signing: Ed25519 signing of SDR records for evidence-grade guarantees.
  # Generate keys with: parachute-keygen --private sidecar.key --public sidecar.pub
  # Copy sidecar.pub to Pro's trusted_keys_dir.
  # signing:
  #   key_path: "/etc/parachute/sidecar.key"
  #   key_id: ""  # Auto-derived from public key if empty
  jsonl:
    path: "/var/lib/parachute/events.jsonl"
  # HTTP upload to Parachute Pro (requires Pro URL and API key)
  # http:
  #   url: "https://pro.example.com/v1/ingest/sdr-batch"
  #   api_key_env: "PARACHUTE_PRO_API_KEY"
  #   batch_size: 50
  #   flush_interval: "10s"
  #   offset_path: "/var/lib/parachute/upload_offset"
  # heartbeat:
  #   interval: "30s"

relay:
  enabled: false
  # server_url: "wss://relay.parachute.io/ws"
  # api_key: "your-api-key"

