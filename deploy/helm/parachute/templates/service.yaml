apiVersion: v1
kind: Service
metadata:
  name: {{ include "parachute.fullname" . }}
  labels:
    {{- include "parachute.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.proxyPort }}
      targetPort: proxy
      protocol: TCP
      name: proxy
  selector:
    {{- include "parachute.selectorLabels" . | nindent 4 }}
