# Parachute Demo Configuration
# Pre-configured to demonstrate all security features

auth:
  username: "admin"
  password_env: "PARACHUTE_PASSWORD"
  allow_insecure: false

risk_policy:
  block_commands:
    - "rm -rf /"
    - "rm -rf ~"
    - ":(){ :|:& };:"
    - "mkfs\\."
    - "dd if=/dev/(zero|random) of=/dev/[sh]d"

  require_approval:
    - "\\brm\\b"
    - "\\bssh\\b"
    - "\\bcurl\\b.*(-X|--request).*POST"
    - "\\bwget\\b"
    - "\\bsudo\\b"
    - "\\bgit\\b.*(push|force)"

egress:
  allow_domains:
    - "api.anthropic.com"
    - "api.openai.com"
    - "github.com"
    - "*.githubusercontent.com"
    - "pypi.org"
    - "npmjs.com"

  pii_patterns:
    - "\\b4[0-9]{12}(?:[0-9]{3})?\\b"
    - "\\b5[1-5][0-9]{14}\\b"
    - "-----BEGIN (?:RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----"
    - "AKIA[0-9A-Z]{16}"
    - "gh[pous]_[a-zA-Z0-9]{36}"

relay:
  enabled: false

storage:
  type: "memory"

upstream: "http://echo-server:8080"
listen: ":8080"
proxy_listen: ":8888"
