# Parachute Pro Demo Configuration

server:
  listen: ":8443"

database:
  url_env: PARACHUTE_PRO_DB_URL
  max_conns: 10
  migration_dir: "/app/migrations"

object_storage:
  endpoint: "/app/data/objects"
  bucket: demo-bundles

crypto:
  signing_key_path: ""
  trusted_keys_dir: ""

tenant:
  id: "demo-tenant"
  name: "Demo Tenant"
  api_keys:
    - "demo-api-key"

ingest:
  max_batch_size: 100
  max_payload_bytes: 10485760

fleet:
  heartbeat_warning_age: "30s"
  heartbeat_offline_age: "60s"

approvals:
  default_timeout: "5m"

slack:
  enabled: false

export:
  retention_days: 7
