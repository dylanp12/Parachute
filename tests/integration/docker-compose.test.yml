services:
  parachute:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: parachute-test
    ports:
      - "18080:8080"
      - "18888:8888"
    volumes:
      - ./parachute.test.yaml:/etc/parachute/config.yaml:ro
    environment:
      - PARACHUTE_PASSWORD=testpass123
    networks:
      - public-net
      - agent-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Dummy agent - simple HTTP server
  dummy-agent:
    image: python:3.11-alpine
    container_name: dummy-agent
    networks:
      - agent-net
    working_dir: /app
    volumes:
      - ./dummy_agent.py:/app/dummy_agent.py:ro
    command: ["python", "/app/dummy_agent.py"]
    depends_on:
      parachute:
        condition: service_started

networks:
  public-net:
    driver: bridge
  agent-net:
    driver: bridge
    internal: true
