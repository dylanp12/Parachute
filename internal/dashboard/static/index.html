<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parachute - Command Control</title>
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-secondary: #1a1a20;
            --bg-card: #22222a;
            --accent: #6366f1;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #2d2d36;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .logo { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem;
        }
        .logo h1 { font-size: 1.5rem; font-weight: 600; }
        .status-badge {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border-radius: 2rem;
            font-size: 0.875rem;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }
        .status-dot.disconnected { background: var(--danger); animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Tab navigation */
        .tabs {
            display: flex; gap: 0;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            background: none; border-top: none; border-left: none; border-right: none;
        }
        .tab:hover { color: var(--text-primary); }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-title {
            display: flex; align-items: center; gap: 0.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem; font-weight: 500;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .pending-count, .ssh-count {
            background: var(--accent); color: white;
            padding: 0.125rem 0.5rem; border-radius: 1rem; font-size: 0.75rem;
        }
        .empty-state {
            text-align: center; padding: 4rem 2rem;
            background: var(--bg-secondary);
            border-radius: 12px; border: 1px dashed var(--border);
        }
        .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state h3 { margin-bottom: 0.5rem; }
        .empty-state p { color: var(--text-secondary); font-size: 0.875rem; }
        .command-card, .ssh-card {
            background: var(--bg-card);
            border-radius: 12px; padding: 1.5rem;
            margin-bottom: 1rem; border: 1px solid var(--border);
            transition: all 0.2s ease;
        }
        .command-card:hover, .ssh-card:hover { border-color: var(--accent); }
        .command-header, .ssh-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;
        }
        .command-id {
            font-family: monospace; font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            padding: 0.25rem 0.5rem; border-radius: 4px;
        }
        .command-time { font-size: 0.75rem; color: var(--text-secondary); }
        .command-content {
            font-family: monospace;
            background: var(--bg-primary);
            padding: 1rem; border-radius: 8px;
            margin-bottom: 1rem; font-size: 0.875rem;
            border: 1px solid var(--border);
            word-break: break-all;
        }
        .command-reason {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1rem;
        }
        .command-reason::before { content: '\26A0\FE0F'; }
        .command-actions { display: flex; gap: 0.75rem; }
        .btn {
            flex: 1; padding: 0.75rem 1.5rem;
            border: none; border-radius: 8px;
            font-weight: 500; font-size: 0.875rem;
            cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-approve { background: var(--success); color: white; }
        .btn-deny { background: var(--danger); color: white; }
        .btn-connect { background: var(--accent); color: white; }
        .btn-disconnect { background: var(--warning); color: #1a1a20; }
        .btn-test { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-sm { flex: none; padding: 0.5rem 1rem; font-size: 0.8rem; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* SSH target styles */
        .ssh-name {
            font-weight: 600; font-size: 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .ssh-connection-dot {
            width: 8px; height: 8px; border-radius: 50%;
        }
        .ssh-connection-dot.connected { background: var(--success); }
        .ssh-connection-dot.disconnected { background: var(--text-secondary); }
        .ssh-details {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem; margin-bottom: 1rem;
        }
        .ssh-detail {
            font-size: 0.8rem; color: var(--text-secondary);
        }
        .ssh-detail strong { color: var(--text-primary); }
        .ssh-chain {
            font-family: monospace; font-size: 0.8rem;
            background: var(--bg-primary); padding: 0.5rem 0.75rem;
            border-radius: 6px; border: 1px solid var(--border);
            margin-bottom: 1rem; color: var(--accent);
        }
        .ssh-labels {
            display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;
        }
        .ssh-label {
            font-size: 0.7rem; padding: 0.2rem 0.5rem;
            background: var(--bg-secondary); border-radius: 4px;
            color: var(--text-secondary);
        }
        .ssh-actions { display: flex; gap: 0.5rem; }

        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border-radius: 8px; border: 1px solid var(--border);
            display: none;
            z-index: 1000;
        }
        .toast.error { border-color: var(--danger); }
        footer {
            margin-top: 3rem; text-align: center;
            color: var(--text-secondary); font-size: 0.75rem;
        }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>Parachute</h1>
            </div>
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connected</span>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('commands')">
                Pending Commands <span class="pending-count" id="pendingCount">0</span>
            </button>
            <button class="tab" onclick="switchTab('ssh')">
                SSH Targets <span class="ssh-count" id="sshCount">0</span>
            </button>
        </div>

        <!-- Commands Tab -->
        <div id="tab-commands" class="tab-content active">
            <div id="commandList">
                <div class="empty-state">
                    <div class="empty-state-icon">&#10003;</div>
                    <h3>All Clear</h3>
                    <p>No commands pending approval</p>
                </div>
            </div>
        </div>

        <!-- SSH Targets Tab -->
        <div id="tab-ssh" class="tab-content">
            <div id="sshList">
                <div class="empty-state">
                    <div class="empty-state-icon">&#8669;</div>
                    <h3>No SSH Targets</h3>
                    <p>SSH execution chaining is not configured or no targets are registered</p>
                </div>
            </div>
        </div>

        <footer>
            <p>Parachute Security Sidecar</p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let pendingCommands = [];
        let sshConnections = [];
        let csrfToken = null;
        let connected = true;
        let activeTab = 'commands';

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        // Get CSRF token from cookie
        function getCSRFToken() {
            const cookies = document.cookie.split(';');
            for (const cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === '_csrf') {
                    return value;
                }
            }
            return csrfToken;
        }

        async function fetchPending() {
            try {
                const response = await fetch('/api/pending', { credentials: 'same-origin' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                pendingCommands = data.pending || [];
                if (data.csrf_token) csrfToken = data.csrf_token;
                setConnected(true);
                renderCommands();
            } catch (err) {
                console.error('Failed to fetch pending:', err);
                setConnected(false);
            }
        }

        async function fetchSSHConnections() {
            try {
                const response = await fetch('/api/ssh/connections', { credentials: 'same-origin' });
                if (!response.ok) {
                    if (response.status === 404) {
                        // SSH not enabled
                        sshConnections = [];
                        renderSSH();
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                sshConnections = data.connections || [];
                renderSSH();
            } catch (err) {
                console.error('Failed to fetch SSH connections:', err);
                sshConnections = [];
                renderSSH();
            }
        }

        function setConnected(isConnected) {
            connected = isConnected;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (isConnected) {
                dot.classList.remove('disconnected');
                text.textContent = 'Connected';
            } else {
                dot.classList.add('disconnected');
                text.textContent = 'Disconnected';
            }
        }

        function renderCommands() {
            const list = document.getElementById('commandList');
            const count = document.getElementById('pendingCount');
            count.textContent = pendingCommands.length;

            if (pendingCommands.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#10003;</div>
                        <h3>All Clear</h3>
                        <p>No commands pending approval</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = pendingCommands.map(cmd => `
                <div class="command-card" id="card-${cmd.id}">
                    <div class="command-header">
                        <span class="command-id">#${cmd.id}${cmd.tool_name === 'ssh_execute' ? ' (SSH)' : ''}</span>
                        <span class="command-time">${new Date(cmd.created_at).toLocaleTimeString()}</span>
                    </div>
                    <div class="command-content">${escapeHtml(cmd.command)}</div>
                    ${cmd.args && cmd.args.target ? `<div class="ssh-chain">Target: ${escapeHtml(cmd.args.target)}</div>` : ''}
                    <div class="command-reason">${escapeHtml(cmd.reason)}</div>
                    <div class="command-actions">
                        <button class="btn btn-approve" onclick="approve('${cmd.id}')">&#10003; Approve</button>
                        <button class="btn btn-deny" onclick="deny('${cmd.id}')">&#10005; Deny</button>
                    </div>
                </div>
            `).join('');
        }

        function renderSSH() {
            const list = document.getElementById('sshList');
            const count = document.getElementById('sshCount');
            count.textContent = sshConnections.length;

            if (sshConnections.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#8669;</div>
                        <h3>No SSH Targets</h3>
                        <p>SSH execution chaining is not configured or no targets are registered</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = sshConnections.map(conn => {
                const t = conn.target;
                const isConnected = conn.connected;
                const labels = t.labels || {};
                const labelHtml = Object.entries(labels).map(([k, v]) =>
                    `<span class="ssh-label">${escapeHtml(k)}: ${escapeHtml(v)}</span>`
                ).join('');

                return `
                <div class="ssh-card">
                    <div class="ssh-header">
                        <span class="ssh-name">
                            <span class="ssh-connection-dot ${isConnected ? 'connected' : 'disconnected'}"></span>
                            ${escapeHtml(t.name)}
                        </span>
                        <span class="command-time">${isConnected ? 'Connected ' + timeAgo(conn.connected_at) : (t.enabled ? 'Disconnected' : 'Disabled')}</span>
                    </div>
                    <div class="ssh-details">
                        <div class="ssh-detail"><strong>Host:</strong> ${escapeHtml(t.host)}:${t.port || 22}</div>
                        <div class="ssh-detail"><strong>User:</strong> ${escapeHtml(t.user)}</div>
                        <div class="ssh-detail"><strong>Auth:</strong> ${escapeHtml(t.auth_method)}</div>
                        ${t.proxy_jump ? `<div class="ssh-detail"><strong>Jump:</strong> ${escapeHtml(t.proxy_jump)}</div>` : ''}
                        ${isConnected ? `<div class="ssh-detail"><strong>Sessions:</strong> ${conn.session_count}</div>` : ''}
                    </div>
                    ${labelHtml ? `<div class="ssh-labels">${labelHtml}</div>` : ''}
                    <div class="ssh-actions">
                        ${isConnected
                            ? `<button class="btn btn-disconnect btn-sm" onclick="sshDisconnect('${t.name}')">Disconnect</button>
                               <button class="btn btn-test btn-sm" onclick="sshTest('${t.name}')">Test</button>`
                            : (t.enabled
                                ? `<button class="btn btn-connect btn-sm" onclick="sshConnect('${t.name}')">Connect</button>`
                                : `<button class="btn btn-sm" disabled>Disabled</button>`)
                        }
                        <button class="btn btn-test btn-sm" onclick="sshViewChain('${t.name}')">View Chain</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function timeAgo(dateStr) {
            if (!dateStr) return '';
            const now = new Date();
            const then = new Date(dateStr);
            const diffMs = now - then;
            const diffMin = Math.floor(diffMs / 60000);
            if (diffMin < 1) return 'just now';
            if (diffMin < 60) return diffMin + 'm ago';
            const diffHr = Math.floor(diffMin / 60);
            if (diffHr < 24) return diffHr + 'h ago';
            return Math.floor(diffHr / 24) + 'd ago';
        }

        async function approve(id) { await handleAction(id, 'approve'); }
        async function deny(id) { await handleAction(id, 'deny'); }

        async function handleAction(id, action) {
            const card = document.getElementById(`card-${id}`);
            const buttons = card.querySelectorAll('.btn');
            buttons.forEach(btn => btn.disabled = true);

            try {
                const token = getCSRFToken();
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['X-CSRF-Token'] = token;

                const response = await fetch(`/api/${action}/${id}`, {
                    method: 'POST', credentials: 'same-origin', headers: headers
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                const data = await response.json();
                if (data.success) {
                    showToast(`Command ${action === 'approve' ? 'approved' : 'denied'}: #${id}`);
                    pendingCommands = pendingCommands.filter(cmd => cmd.id !== id);
                    renderCommands();
                }
            } catch (err) {
                console.error(`Failed to ${action}:`, err);
                showToast(`Error: ${err.message}`, true);
                buttons.forEach(btn => btn.disabled = false);
            }
        }

        async function sshConnect(name) {
            try {
                const response = await fetch(`/api/ssh/connect/${name}`, {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    showToast(`Connected to ${name} via ${(data.chain || []).join(' -> ')}`);
                    fetchSSHConnections();
                } else {
                    showToast(`Failed: ${data.error}`, true);
                }
            } catch (err) {
                showToast(`Error: ${err.message}`, true);
            }
        }

        async function sshDisconnect(name) {
            try {
                const response = await fetch(`/api/ssh/disconnect/${name}`, {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    showToast(`Disconnected from ${name}`);
                    fetchSSHConnections();
                } else {
                    showToast(`Failed: ${data.error}`, true);
                }
            } catch (err) {
                showToast(`Error: ${err.message}`, true);
            }
        }

        async function sshTest(name) {
            showToast(`Testing connection to ${name}...`);
            try {
                const response = await fetch(`/api/ssh/test/${name}`, {
                    method: 'POST', credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                if (data.success) {
                    showToast(`Connection test passed for ${name}`);
                } else {
                    showToast(`Test failed: ${data.error}`, true);
                }
            } catch (err) {
                showToast(`Error: ${err.message}`, true);
            }
        }

        async function sshViewChain(name) {
            try {
                const response = await fetch(`/api/ssh/chain/${name}`, { credentials: 'same-origin' });
                const data = await response.json();
                if (response.ok) {
                    const chainStr = (data.chain || []).map(h =>
                        `${h.name} (${h.user || ''}@${h.host || ''}:${h.port || 22})${h.is_jump ? ' [jump]' : ' [target]'}`
                    ).join(' -> ');
                    showToast(`Chain: ${chainStr}`);
                } else {
                    showToast(`Error: ${data.error}`, true);
                }
            } catch (err) {
                showToast(`Error: ${err.message}`, true);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 4000);
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        // Poll both APIs
        setInterval(fetchPending, 3000);
        setInterval(fetchSSHConnections, 5000);
        fetchPending();
        fetchSSHConnections();
    </script>
</body>
</html>
