# Parachute Security Sidecar - Base Configuration
#
# This defines only the Parachute service. Compose with an agent runtime:
#   docker compose -f docker-compose.yml -f agents/claude-code/compose.yaml up -d
#
# Or use the convenience wrapper:
#   ./run.sh claude-code
#
# Available agents: openclaw, nemoclaw, claude-code, opencode, t3-code, generic
# See agents/ directory for details.

services:
  parachute:
    build: .
    container_name: parachute
    ports:
      - "8080:8080"
      - "8888:8888"
    volumes:
      - ./parachute.yaml:/etc/parachute/config.yaml:ro
    environment:
      # IMPORTANT: Set PARACHUTE_PASSWORD in your environment. Do not deploy with defaults.
      - PARACHUTE_PASSWORD=${PARACHUTE_PASSWORD:?Set PARACHUTE_PASSWORD before starting}
    networks:
      - public-net
      - agent-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  public-net:
    driver: bridge
  agent-net:
    driver: bridge
    internal: true
