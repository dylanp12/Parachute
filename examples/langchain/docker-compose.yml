# LangChain Agent + Parachute Security Sidecar
#
# This deployment routes all LangChain HTTP traffic through Parachute,
# providing egress control, PII detection, and command interception.
#
# Usage:
#   export OPENAI_API_KEY="your-key"
#   export PARACHUTE_PASSWORD="your-password"
#   docker compose up -d

services:
  parachute:
    image: parachutesecurity/parachute:latest
    container_name: parachute
    ports:
      - "8080:8080"
      - "8888:8888"
    volumes:
      - ./parachute.yaml:/etc/parachute/config.yaml:ro
    environment:
      - PARACHUTE_PASSWORD=${PARACHUTE_PASSWORD:-changeme}
    networks:
      - public-net
      - agent-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  langchain-agent:
    build: .
    container_name: langchain-agent
    networks:
      - agent-net
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HTTP_PROXY=http://parachute:8888
      - HTTPS_PROXY=http://parachute:8888
      - http_proxy=http://parachute:8888
      - https_proxy=http://parachute:8888
      - NO_PROXY=localhost,127.0.0.1,parachute
      - no_proxy=localhost,127.0.0.1,parachute
    volumes:
      - ./workspace:/workspace
    depends_on:
      parachute:
        condition: service_healthy
    restart: unless-stopped

networks:
  public-net:
    driver: bridge
  agent-net:
    driver: bridge
    internal: true
