# OpenAI Codex CLI + Parachute Security Sidecar
#
# Parachute provides defense-in-depth on top of Codex's built-in sandboxing:
# - Egress domain whitelisting (Codex sandbox allows all outbound)
# - PII detection in outbound traffic
# - Audit logging of all commands
# - HITL approval for risky operations
#
# Usage:
#   export OPENAI_API_KEY="your-key"
#   export PARACHUTE_PASSWORD="your-password"
#   docker compose up -d

services:
  parachute:
    image: dylanp12/parachute:latest
    container_name: parachute
    ports:
      - "8080:8080"
      - "8888:8888"
    volumes:
      - ./parachute.yaml:/etc/parachute/config.yaml:ro
    environment:
      - PARACHUTE_PASSWORD=${PARACHUTE_PASSWORD:-changeme}
    networks:
      - public-net
      - agent-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  codex:
    image: ${CODEX_IMAGE:-node:22-slim}
    container_name: codex-cli
    networks:
      - agent-net
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HTTP_PROXY=http://parachute:8888
      - HTTPS_PROXY=http://parachute:8888
      - http_proxy=http://parachute:8888
      - https_proxy=http://parachute:8888
      - NO_PROXY=localhost,127.0.0.1,parachute
      - no_proxy=localhost,127.0.0.1,parachute
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    depends_on:
      parachute:
        condition: service_healthy
    restart: unless-stopped

networks:
  public-net:
    driver: bridge
  agent-net:
    driver: bridge
    internal: true
